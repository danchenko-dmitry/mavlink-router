# MAVLink Router Configuration for Raspberry Pi
# Receives MAVLink from network (UDP/TCP) and forwards to hardware UART

[General]
# TCP server is enabled by default on port 5760
# You can change it or disable it here:
# TcpServerPort = 5760  # Set to 0 to disable

# Logging verbosity (stderr)
# Valid values: <error>, <warning>, <info>, <debug> or <trace>
# Default: <info>
# Uncomment the line below to enable verbose debug output:
# DebugLogLevel = debug

# Server mode: listens on specified address and port
[TcpEndpoint tcp_input]
Address = 0.0.0.0
Port = 5760


# UART endpoint - sends MAVLink messages to hardware UART
# Adjust Device and Baud to match your Raspberry Pi UART
[UartEndpoint rpi_uart]
Device = /dev/ttyAMA0
Baud = 115200
# Common baudrates: 9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600

# Optional: Enable flow control if your UART device requires it
# FlowControl = false

